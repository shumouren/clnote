# 手动定义应用（ccc-notes）自定义命令的权限。
# Tauri v2 会把 src-tauri/permissions/ 下的权限文件命名空间化为
# `<包名>:allow-<命令>`（此处即 ccc-notes:allow-<命令>），
# 供 capabilities/default.json 引用。
# 由于 tauri-build 未自动为这些命令生成权限，这里显式声明。

[[permission]]
identifier = "allow-list-nodes"
description = "Enables the list_nodes command."
commands.allow = ["list_nodes"]

[[permission]]
identifier = "allow-get-node"
description = "Enables the get_node command."
commands.allow = ["get_node"]

[[permission]]
identifier = "allow-save-node"
description = "Enables the save_node command."
commands.allow = ["save_node"]

[[permission]]
identifier = "allow-delete-node"
description = "Enables the delete_node command."
commands.allow = ["delete_node"]

[[permission]]
identifier = "allow-move-node"
description = "Enables the move_node command."
commands.allow = ["move_node"]

[[permission]]
identifier = "allow-clear-all"
description = "Enables the clear_all command."
commands.allow = ["clear_all"]

[[permission]]
identifier = "allow-put-many"
description = "Enables the put_many command."
commands.allow = ["put_many"]

[[permission]]
identifier = "allow-next-order"
description = "Enables the next_order command."
commands.allow = ["next_order"]

[[permission]]
identifier = "allow-search-nodes"
description = "Enables the search_nodes command."
commands.allow = ["search_nodes"]

[[permission]]
identifier = "allow-get-data-dir"
description = "Enables the get_data_dir command."
commands.allow = ["get_data_dir"]

[[permission]]
identifier = "allow-set-data-dir"
description = "Enables the set_data_dir command."
commands.allow = ["set_data_dir"]

[[permission]]
identifier = "allow-save-file"
description = "Enables the save_file command (export material to a local path)."
commands.allow = ["save_file"]

