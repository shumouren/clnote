[package]
name = "clnote"
version = "3.0.0"
description = "本地优先的跨平台笔记软件（Windows / Linux / Android）"
authors = ["cl"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：从源码编译 SQLite，确保包含 FTS5（无需系统装 SQLite）
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
